[tools]
go = "1.27"
act = "0.2.89"
"go:golang.org/x/perf/cmd/benchstat" = "v0.0.0-20260819171926-ebcb4798430d"

[tasks.test]
run = "go test -v -race ./..."
description = "Run all tests with race detector"

[tasks.bench]
run = "go test -run=^$ -bench=. -benchmem -count=10 ./..."
description = "Run benchmarks with the default JSON v2 implementation"

[tasks.lint]
run = "go vet ./..."
description = "Run go vet"

[tasks.test-v1]
run = "GOEXPERIMENT=nojsonv2 go test -v -race ./..."
description = "Run all tests with the JSON v1 fallback"

[tasks.lint-v1]
run = "GOEXPERIMENT=nojsonv2 go vet ./..."
description = "Run go vet with the JSON v1 fallback"

[tasks.ci]
run = "act -W .github/workflows/ci.yml"
description = "Run CI workflow locally with act"
